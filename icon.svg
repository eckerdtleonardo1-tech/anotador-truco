<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="6"/>
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="16 16"/>

  <!-- Number 1 -->
  <g fill="#1e293b" font-family="Georgia, serif" font-weight="bold" font-size="72">
    <text x="60" y="110">1</text>
    <text x="452" y="402" transform="rotate(180 452 402)">1</text>
  </g>

  <!-- The Sword -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Scale, rotate, and center the longer sword -->
    <g transform="scale(1.8) rotate(45) translate(0, 50)">
      <!-- Blade (made longer: extends to -170 instead of -140) -->
      <path d="M-12,-20 L-6,-130 L0,-170 L6,-130 L12,-20 Z" fill="url(#bladeGrad)" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      
      <!-- Crossguard Bar -->
      <rect x="-40" y="-25" width="80" height="10" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <!-- Crossguard Ends -->
      <circle cx="-40" cy="-20" r="7" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <circle cx="40" cy="-20" r="7" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <!-- Crossguard Center -->
      <rect x="-16" y="-30" width="32" height="20" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>

      <!-- Grip -->
      <rect x="-8" y="-10" width="16" height="55" fill="#991b1b" stroke="#450a0a" stroke-width="2"/>
      <!-- Grip Wraps -->
      <line x1="-8" y1="0" x2="8" y2="10" stroke="#fcd34d" stroke-width="2"/>
      <line x1="-8" y1="15" x2="8" y2="25" stroke="#fcd34d" stroke-width="2"/>
      <line x1="-8" y1="30" x2="8" y2="40" stroke="#fcd34d" stroke-width="2"/>

      <!-- Pommel -->
      <circle cx="0" cy="50" r="14" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <!-- Pommel Gem -->
      <circle cx="0" cy="50" r="5" fill="#dc2626"/>
    </g>
  </g>
</svg>
