<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Parchment Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </radialGradient>
    
    <!-- Ultra Premium Gold Gradient -->
    <linearGradient id="goldOrnate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Deep Polished Steel for the blade facets -->
    <linearGradient id="steelRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="steelLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Epic Shadows and Glows -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="512" height="512" rx="100" fill="url(#cardBg)" stroke="#d97706" stroke-width="8"/>
  
  <!-- Sunburst Background -->
  <g transform="translate(256,256)">
    <g fill="#f59e0b" opacity="0.15">
      <path d="M-30,-300 L30,-300 L0,0 Z" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(45)" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(90)" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(135)" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(180)" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(225)" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(270)" />
      <path d="M-30,-300 L30,-300 L0,0 Z" transform="rotate(315)" />
    </g>
  </g>

  <!-- Ornate Borders -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldOrnate)" stroke-width="12" />
  <rect x="44" y="44" width="424" height="424" rx="64" fill="none" stroke="#78350f" stroke-width="3" opacity="0.5"/>
  <rect x="52" y="52" width="408" height="408" rx="56" fill="none" stroke="url(#goldOrnate)" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- Epic Number 1s -->
  <g font-family="Georgia, serif" font-weight="900" font-size="96" filter="url(#shadow)">
    <text x="75" y="135" fill="#dc2626">1</text>
    <text x="75" y="135" fill="none" stroke="#fff" stroke-width="2">1</text>
    <text x="437" y="377" fill="#dc2626" transform="rotate(180 437 377)">1</text>
    <text x="437" y="377" fill="none" stroke="#fff" stroke-width="2" transform="rotate(180 437 377)">1</text>
  </g>

  <!-- The Legendary 1 de Espada -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <g transform="scale(2) rotate(45) translate(0, 45)">
      
      <!-- Backlight Glow Aura -->
      <path d="M-20,-20 L0,-200 L20,-20 Z" fill="#fef08a" filter="url(#glow)" opacity="0.6"/>

      <!-- Blade Facets -->
      <path d="M-14,-20 L-6,-150 L0,-190 L6,-150 L14,-20 Z" fill="url(#steelRight)" />
      <path d="M-14,-20 L-6,-150 L0,-190 L0,-20 Z" fill="url(#steelLeft)" />
      
      <!-- Blood Groove (Fuller) -->
      <path d="M-2,-20 L-2,-130 L0,-135 L2,-130 L2,-20 Z" fill="#1e293b" />
      <path d="M0,-20 L0,-135 L2,-130 L2,-20 Z" fill="#475569" />

      <!-- === SUTIL Y LINDO: Enredadera Clásica (Classic Vine) === -->
      <!-- Vine Path -->
      <path d="M12,-20 C30,-45 -20,-75 0,-105 C15,-125 -5,-145 -2,-165" fill="none" stroke="#16a34a" stroke-width="1.5" />
      <!-- Leaves -->
      <path d="M16,-38 Q24,-33 22,-43 Q14,-41 16,-38 Z" fill="#4ade80" />
      <path d="M-11,-65 Q-20,-60 -17,-70 Q-9,-67 -11,-65 Z" fill="#4ade80" />
      <path d="M4,-95 Q12,-90 10,-100 Q2,-97 4,-95 Z" fill="#4ade80" />
      <path d="M-3,-135 Q-10,-130 -8,-140 Q0,-137 -3,-135 Z" fill="#4ade80" />

      <!-- === SUTIL Y LINDO: Chispas Mágicas (Magical Sparks) === -->
      <circle cx="-25" cy="-60" r="1.5" fill="#fef08a" filter="url(#glow)"/>
      <circle cx="20" cy="-110" r="2" fill="#fff" filter="url(#glow)"/>
      <circle cx="-15" cy="-150" r="1" fill="#fde047" filter="url(#glow)"/>
      <circle cx="25" cy="-30" r="1.5" fill="#fef08a" filter="url(#glow)"/>

      <!-- Ornate Crossguard (Sweeping Wings) -->
      <path d="M-60,-35 Q-30,-15 0,-20 Q30,-15 60,-35 Q30,-5 0,0 Q-30,-5 -60,-35 Z" fill="url(#goldOrnate)" />
      <path d="M-45,-25 Q-20,-10 0,-15 Q20,-10 45,-25 Q20,-5 0,-5 Q-20,-5 -45,-25 Z" fill="#fde047" />

      <!-- Crossguard Center Housing -->
      <rect x="-16" y="-22" width="32" height="24" rx="6" fill="url(#goldOrnate)" />
      <rect x="-12" y="-18" width="24" height="16" rx="4" fill="#78350f" />
      
      <!-- Center Ruby -->
      <circle cx="0" cy="-10" r="6" fill="#ef4444" filter="url(#glow)"/>
      <circle cx="0" cy="-10" r="6" fill="#dc2626" />
      <circle cx="-2" cy="-12" r="2" fill="#fca5a5" />

      <!-- Leather Grip -->
      <path d="M-8,2 L8,2 L6,48 L-6,48 Z" fill="#7f1d1d" />
      <!-- Gold Wrap Lines -->
      <path d="M-7,10 L7,10 M-7,20 L7,20 M-6,30 L6,30 M-6,40 L6,40" stroke="url(#goldOrnate)" stroke-width="2" />

      <!-- Pommel -->
      <circle cx="0" cy="52" r="14" fill="url(#goldOrnate)" />
      <circle cx="0" cy="52" r="8" fill="#78350f" />
      <!-- Pommel Sapphire -->
      <circle cx="0" cy="52" r="5" fill="#3b82f6" />
      <circle cx="-1" cy="51" r="1.5" fill="#93c5fd" />
    </g>
  </g>
</svg>
