<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Anotador de Truco</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #09090b; color: #f4f4f5; touch-action: manipulation; font-family: 'Inter', system-ui, sans-serif; }
    input, button { touch-action: manipulation; font-family: inherit; }
    .hidden-el { display: none !important; }

    .col-divider { position: relative; }
    .col-divider:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0; top: 2rem; bottom: 2rem;
      width: 1px;
      background: linear-gradient(to bottom, transparent, #3f3f46, transparent);
    }

    .mode-3 .score-num { font-size: 3rem; }
    .mode-3 .team-label { font-size: 0.8rem; max-width: 72px; }
    @media (min-width: 640px) {
      .mode-3 .score-num { font-size: 4rem; }
      .mode-3 .team-label { font-size: 1rem; max-width: 100px; }
    }

    /* Fósforo SVG */
    .match-group { display: inline-flex; gap: 1px; align-items: end; }
    .match-stick { width: 3px; height: 18px; border-radius: 1px; background: #a1a1aa; transition: background 0.2s; }
    .match-stick.lit { background: #60a5fa; }
    .match-diagonal {
      position: absolute;
      left: -1px; top: 50%; width: calc(100% + 2px);
      height: 2px; border-radius: 1px;
      background: #60a5fa;
      transform: rotate(-35deg);
      transform-origin: center;
    }
    .match-cluster { position: relative; display: inline-flex; gap: 2px; padding: 0 2px; }

    /* Score pop */
    @keyframes scorePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .score-pop { animation: scorePop 0.25s ease-out; }

    /* Confetti */
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed; top: -10px; z-index: 100;
      width: 8px; height: 8px; border-radius: 1px;
      animation: confettiFall linear forwards;
      pointer-events: none;
    }

    /* Modal fade */
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-enter { animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

    /* Progress bar */
    .progress-track { background: #27272a; border-radius: 999px; overflow: hidden; }
    .progress-fill { transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 999px; min-width: 0; }

    /* Subtle noise */
    .surface-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    }
  </style>
</head>

<script>
  const DEFAULTS = ["Nosotros", "Ellos", "Los Otros"];
  const STORAGE_KEY = "truco_state_v2";

  let state = {
    mode: 2,
    teams: [...DEFAULTS],
    scores: [0, 0, 0],
    limit: 30,
    winner: null,
    manos: 0
  };

  let history = [];

  // --- LocalStorage ---
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && saved.scores) { Object.assign(state, saved); }
      }
    } catch(e) {}
  }

  // --- Haptic ---
  function haptic(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch(e) {}
  }

  // --- Matchsticks Rendering ---
  function renderMatches(containerId, score) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const displayScore = state.limit === 15 ? score : (score <= 15 ? score : score - 15);
    const fullGroups = Math.floor(displayScore / 5);
    const remainder = displayScore % 5;
    let html = '';

    for (let g = 0; g < fullGroups; g++) {
      html += '<span class="match-cluster">';
      for (let s = 0; s < 4; s++) html += '<span class="match-stick lit"></span>';
      html += '<span class="match-diagonal"></span>';
      html += '</span>';
    }
    if (remainder > 0) {
      html += '<span class="match-cluster">';
      for (let s = 0; s < remainder; s++) html += '<span class="match-stick lit"></span>';
      html += '</span>';
    }
    el.innerHTML = html;
  }

  // --- Confetti ---
  function launchConfetti() {
    const colors = ['#3b82f6','#60a5fa','#93c5fd','#2563eb','#f59e0b','#10b981','#f472b6','#a78bfa'];
    const container = document.body;
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      piece.style.animationDelay = (Math.random() * 0.8) + 's';
      piece.style.width = (Math.random() * 6 + 4) + 'px';
      piece.style.height = (Math.random() * 6 + 4) + 'px';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
      container.appendChild(piece);
      setTimeout(() => piece.remove(), 4000);
    }
  }

  // --- Score Pop Animation ---
  function popScore(teamIdx) {
    const el = document.getElementById(`score${teamIdx}-text`);
    if (!el) return;
    el.classList.remove('score-pop');
    void el.offsetWidth;
    el.classList.add('score-pop');
  }

  // --- Toggle helpers ---
  function setToggle(activeId, inactiveId) {
    document.getElementById(activeId).className = "px-3 py-1 rounded-md text-xs font-bold transition-all bg-blue-600 text-white";
    document.getElementById(inactiveId).className = "px-3 py-1 rounded-md text-xs font-bold transition-all text-zinc-500 hover:text-zinc-300";
  }

  // --- UI Update ---
  function getPhase(score) {
    if (state.limit === 15) return "Puntos";
    return score < 15 ? "Malas" : "Buenas";
  }
  function getPhaseScore(score) {
    if (state.limit === 15) return score;
    return score <= 15 ? score : score - 15;
  }

  function updateUI() {
    const board = document.getElementById('main-board');
    const col3 = document.getElementById('column-3');

    if (state.mode === 3) {
      board.classList.remove('max-w-md');
      board.classList.add('max-w-2xl', 'mode-3');
      col3.classList.remove('hidden-el');
      setToggle('btn-mode-3', 'btn-mode-2');
    } else {
      board.classList.remove('max-w-2xl', 'mode-3');
      board.classList.add('max-w-md');
      col3.classList.add('hidden-el');
      setToggle('btn-mode-2', 'btn-mode-3');
    }

    if (state.limit === 15) setToggle('btn-limit-15', 'btn-limit-30');
    else setToggle('btn-limit-30', 'btn-limit-15');

    for (let i = 0; i < 3; i++) {
      const t = i + 1;
      document.getElementById(`score${t}-text`).innerText = getPhaseScore(state.scores[i]);
      document.getElementById(`phase${t}-text`).innerText = getPhase(state.scores[i]);
      document.getElementById(`team${t}-name`).innerText = state.teams[i];
      document.getElementById(`btn-minus-${t}`).disabled = state.scores[i] === 0;

      const pct = Math.min(100, (state.scores[i] / state.limit) * 100);
      document.getElementById(`progress-${t}`).style.width = pct + '%';

      renderMatches(`matches-${t}`, state.scores[i]);
    }

    document.getElementById('mano-count').innerText = state.manos;
    document.getElementById('btn-undo').disabled = history.length === 0;

    const modal = document.getElementById('winner-modal');
    if (state.winner) {
      document.getElementById('winner-name').innerText = state.winner;
      modal.classList.remove('hidden-el');
    } else {
      modal.classList.add('hidden-el');
    }

    saveState();
  }

  // --- Core Logic ---
  function changeScore(team, amount) {
    if (state.winner) return;
    const idx = team - 1;

    history.push({
      scores: [...state.scores],
      manos: state.manos,
      winner: state.winner
    });
    if (history.length > 50) history.shift();

    state.scores[idx] = Math.max(0, state.scores[idx] + amount);

    if (amount > 0) state.manos++;

    if (state.scores[idx] >= state.limit) {
      state.scores[idx] = state.limit;
      state.winner = state.teams[idx];
      setTimeout(launchConfetti, 100);
      haptic(80);
    } else {
      haptic(15);
    }

    popScore(team);
    updateUI();
  }

  function undoLast() {
    if (history.length === 0) return;
    const prev = history.pop();
    state.scores = prev.scores;
    state.manos = prev.manos;
    state.winner = prev.winner;
    haptic(10);
    updateUI();
  }

  function setLimit(newLimit) {
    if (state.limit === newLimit) return;
    state.limit = newLimit;
    history = [];
    resetGame();
  }
  function setMode(newMode) {
    if (state.mode === newMode) return;
    state.mode = newMode;
    history = [];
    resetGame();
  }

  function resetGame() {
    state.scores = [0, 0, 0];
    state.winner = null;
    state.manos = 0;
    history = [];
    updateUI();
  }

  function confirmReset() {
    if (state.scores.every(s => s === 0)) return;
    document.getElementById('confirm-modal').classList.remove('hidden-el');
  }
  function dismissConfirm() {
    document.getElementById('confirm-modal').classList.add('hidden-el');
  }

  // --- Team Editing ---
  function startEditing(teamId) {
    const idx = teamId - 1;
    document.getElementById(`team${teamId}-display`).classList.add('hidden-el');
    document.getElementById(`team${teamId}-edit`).classList.remove('hidden-el');
    const input = document.getElementById(`team${teamId}-input`);
    input.value = state.teams[idx];
    input.focus();
    input.select();
  }
  function saveTeam(teamId) {
    const idx = teamId - 1;
    const input = document.getElementById(`team${teamId}-input`);
    state.teams[idx] = input.value.trim() || DEFAULTS[idx];
    document.getElementById(`team${teamId}-edit`).classList.add('hidden-el');
    document.getElementById(`team${teamId}-display`).classList.remove('hidden-el');
    updateUI();
  }

  document.addEventListener('click', (e) => {
    [1, 2, 3].forEach(id => {
      const editDiv = document.getElementById(`team${id}-edit`);
      const displayDiv = document.getElementById(`team${id}-display`);
      if (!editDiv.classList.contains('hidden-el') && !editDiv.contains(e.target) && !displayDiv.contains(e.target)) {
        saveTeam(id);
      }
    });
  });

  // --- Init ---
  loadState();
  updateUI();
</script>
</body>
</html>
